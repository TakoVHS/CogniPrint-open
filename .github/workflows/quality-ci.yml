name: Quality CI

on:
  push:
    branches: ["main", "gpt6-review"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Full quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out exact repository snapshot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build ruff
          python -m pip check

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run complete unit-test discovery
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate reviewer-facing research story
        run: python scripts/check_reviewer_web_contract.py

      - name: Validate public benchmark contract
        run: python scripts/check_public_benchmark_v11.py

      - name: Scan tracked source tree for high-risk secrets
        run: python scripts/secret_scan.py

      - name: Validate sanitized public-release selection
        run: python scripts/export_public_release.py --check-only

      - name: Build distributable package
        run: python -m build
