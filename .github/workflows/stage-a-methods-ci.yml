name: Stage A Methods CI

on:
  pull_request:
    paths:
      - ".github/workflows/stage-a-methods-ci.yml"
      - "src/cogniprint/benchmarks/development_methods.py"
      - "src/cogniprint/benchmarks/development_statistics.py"
      - "tests/test_stage_a_development_methods.py"
      - "docs/stage-a-development-methods-001.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-a-methods:
    name: Stage A methods / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile Stage A methods
        run: |
          python -m py_compile             src/cogniprint/benchmarks/development_methods.py             src/cogniprint/benchmarks/development_statistics.py             tests/test_stage_a_development_methods.py

      - name: Run Stage A methods tests
        run: |
          python -m unittest discover             -s tests             -p "test_stage_a_development_methods.py"             -v

      - name: Re-run Stage A methods tests
        run: |
          python -m unittest discover             -s tests             -p "test_stage_a_development_methods.py"             -v
