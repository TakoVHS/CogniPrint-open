name: Bind cogniprint.org once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write

jobs:
  bind-pages-domain:
    if: github.event.pull_request.title == 'OPS_TRIGGER_PAGES_BIND_PR_20260824'
    runs-on: ubuntu-latest
    steps:
      - name: Probe and bind Pages custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"

          before_code=$(curl -sS -o /tmp/pages-before.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$api" || true)

          put_code=$(curl -sS -o /tmp/pages-put.json -w '%{http_code}' \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$api" \
            -d '{"cname":"cogniprint.org","https_enforced":true,"source":{"branch":"gh-pages","path":"/"}}' || true)

          after_code=$(curl -sS -o /tmp/pages-after.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$api" || true)

          BEFORE_CODE="$before_code" PUT_CODE="$put_code" AFTER_CODE="$after_code" python3 - <<'PY'
          import json, os
          from pathlib import Path
          def read_payload(path):
              p = Path(path)
              if not p.exists(): return None
              raw = p.read_text(encoding='utf-8', errors='replace')
              try: return json.loads(raw)
              except Exception: return raw[:4000]
          out = {
              'before_status': os.environ.get('BEFORE_CODE'),
              'before': read_payload('/tmp/pages-before.json'),
              'put_status': os.environ.get('PUT_CODE'),
              'put': read_payload('/tmp/pages-put.json'),
              'after_status': os.environ.get('AFTER_CODE'),
              'after': read_payload('/tmp/pages-after.json'),
          }
          print('PAGES_BIND_PROBE_20260824=' + json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY
