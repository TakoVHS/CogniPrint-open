name: Bind cogniprint.org once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages-bind-once-20260824.yml'

permissions:
  contents: write
  pages: write

jobs:
  bind-pages-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe and bind Pages custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p .ops
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"

          before_code=$(curl -sS -o /tmp/pages-before.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$api" || true)

          put_code=$(curl -sS -o /tmp/pages-put.json -w '%{http_code}' \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$api" \
            -d '{"cname":"cogniprint.org","https_enforced":true,"source":{"branch":"gh-pages","path":"/"}}' || true)

          after_code=$(curl -sS -o /tmp/pages-after.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$api" || true)

          BEFORE_CODE="$before_code" PUT_CODE="$put_code" AFTER_CODE="$after_code" python3 - <<'PY'
          import json, os
          from pathlib import Path
          def read_payload(path):
              p = Path(path)
              if not p.exists(): return None
              raw = p.read_text(encoding='utf-8', errors='replace')
              try: return json.loads(raw)
              except Exception: return raw[:4000]
          out = {
              'before_status': os.environ.get('BEFORE_CODE'),
              'before': read_payload('/tmp/pages-before.json'),
              'put_status': os.environ.get('PUT_CODE'),
              'put': read_payload('/tmp/pages-put.json'),
              'after_status': os.environ.get('AFTER_CODE'),
              'after': read_payload('/tmp/pages-after.json'),
          }
          Path('.ops/pages-bind-20260824.json').write_text(json.dumps(out, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit probe result
        if: always()
        run: |
          test -f .ops/pages-bind-20260824.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ops/pages-bind-20260824.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: record Pages bind result 2026-08-24'
          git pull --rebase origin main
          git push origin HEAD:main
