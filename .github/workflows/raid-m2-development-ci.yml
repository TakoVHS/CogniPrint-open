name: RAID M2 Development CI

on:
  pull_request:
    paths:
      - ".github/workflows/raid-m2-development-ci.yml"
      - "src/cogniprint/benchmarks/raid_m2.py"
      - "src/cogniprint/benchmarks/ngram.py"
      - "src/cogniprint/benchmarks/development_methods.py"
      - "src/cogniprint/benchmarks/development_statistics.py"
      - "scripts/analyze_raid_calibration_m2.py"
      - "tests/test_raid_calibration_m2.py"
      - "tests/test_raid_ngram_baselines.py"
      - "docs/raid-calibration-m2-development.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raid-m2-development:
    name: RAID M2 development / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile M2 modules and CLI
        run: python -m py_compile src/cogniprint/benchmarks/raid_m2.py src/cogniprint/benchmarks/ngram.py scripts/analyze_raid_calibration_m2.py tests/test_raid_calibration_m2.py

      - name: Run M2 contract and CLI tests
        run: python -m unittest discover -s tests -p "test_raid_calibration_m2.py" -v

      - name: Run n-gram regression tests
        run: python -m unittest discover -s tests -p "test_raid_ngram_baselines.py" -v
