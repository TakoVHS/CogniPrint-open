name: Verify Zenodo DOI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-zenodo.yml'
      - 'audit/zenodo-blocker.md'
      - 'CITATION.cff'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify DOI resolver and Zenodo record
        shell: bash
        run: |
          set -euo pipefail
          DOI='10.5281/zenodo.20756421'
          RECORD='20756421'
          mkdir -p zenodo-verification

          echo "doi=$DOI" | tee zenodo-verification/report.txt
          echo "checked_at=$(date -u +%FT%TZ)" | tee -a zenodo-verification/report.txt

          DOI_FINAL=$(curl --fail-with-body --silent --show-error --location \
            --output /dev/null --write-out '%{url_effective}' \
            "https://doi.org/$DOI")
          echo "doi_final_url=$DOI_FINAL" | tee -a zenodo-verification/report.txt

          ZENODO_HTTP=$(curl --silent --show-error \
            --output zenodo-verification/record.json \
            --write-out '%{http_code}' \
            "https://zenodo.org/api/records/$RECORD")
          echo "zenodo_http=$ZENODO_HTTP" | tee -a zenodo-verification/report.txt

          export DOI ZENODO_HTTP
          python - <<'PY' | tee -a zenodo-verification/report.txt
          import json, os, sys
          from pathlib import Path

          expected_doi = os.environ['DOI']
          http = os.environ['ZENODO_HTTP']
          path = Path('zenodo-verification/record.json')
          if http != '200':
              print('record_public=false')
              print(f'failure=zenodo_http_{http}')
              sys.exit(1)

          try:
              data = json.loads(path.read_text())
          except Exception as exc:
              print('record_public=false')
              print(f'failure=invalid_json:{exc}')
              sys.exit(1)

          metadata = data.get('metadata') or {}
          title = metadata.get('title') or ''
          version = metadata.get('version') or ''
          creators = metadata.get('creators') or []
          creator_names = [str(c.get('person_or_org', {}).get('name') or c.get('name') or '') for c in creators]
          pids = data.get('pids') or {}
          doi_obj = pids.get('doi') or {}
          record_doi = doi_obj.get('identifier') or metadata.get('doi') or ''

          print('record_public=true')
          print(f'record_doi={record_doi}')
          print(f'title={title}')
          print(f'version={version}')
          print('creators=' + '; '.join(creator_names))

          checks = {
              'doi_match': record_doi.lower() == expected_doi.lower(),
              'title_match': 'cogniprint' in title.lower(),
              'creator_match': any('adriashkin' in n.lower() for n in creator_names),
              'version_match': (not version) or version.lstrip('v') == '0.1.2',
          }
          for key, value in checks.items():
              print(f'{key}={str(value).lower()}')
          if not all(checks.values()):
              print('verification=FAIL')
              sys.exit(1)
          print('verification=PASS')
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-verification
          path: zenodo-verification/
          if-no-files-found: warn
