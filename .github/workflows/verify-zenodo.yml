name: Verify Zenodo DOI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-zenodo.yml'
      - 'audit/zenodo-blocker.md'
      - 'CITATION.cff'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify DOI resolver and Zenodo record
        shell: bash
        run: |
          set -u
          DOI='10.5281/zenodo.20756421'
          RECORD='20756421'
          OUT='audit/zenodo-verification-latest.txt'
          TMP='zenodo-verification'
          mkdir -p "$TMP"

          {
            echo "doi=$DOI"
            echo "checked_at=$(date -u +%FT%TZ)"
          } > "$OUT"

          DOI_FINAL=$(curl --silent --show-error --location \
            --output /dev/null --write-out '%{url_effective}' \
            "https://doi.org/$DOI" 2>"$TMP/doi-error.txt")
          DOI_EXIT=$?
          echo "doi_curl_exit=$DOI_EXIT" >> "$OUT"
          echo "doi_final_url=$DOI_FINAL" >> "$OUT"

          ZENODO_HTTP=$(curl --silent --show-error \
            --output "$TMP/record.json" \
            --write-out '%{http_code}' \
            "https://zenodo.org/api/records/$RECORD" 2>"$TMP/zenodo-error.txt")
          ZENODO_EXIT=$?
          echo "zenodo_curl_exit=$ZENODO_EXIT" >> "$OUT"
          echo "zenodo_http=$ZENODO_HTTP" >> "$OUT"

          export DOI ZENODO_HTTP ZENODO_EXIT
          python - <<'PY' >> "$OUT"
          import json, os
          from pathlib import Path

          expected_doi = os.environ['DOI']
          http = os.environ.get('ZENODO_HTTP', '')
          curl_exit = os.environ.get('ZENODO_EXIT', '')
          path = Path('zenodo-verification/record.json')

          checks = {
              'record_public': False,
              'doi_match': False,
              'title_match': False,
              'creator_match': False,
              'version_match': False,
          }

          if curl_exit == '0' and http == '200' and path.exists():
              try:
                  data = json.loads(path.read_text())
                  metadata = data.get('metadata') or {}
                  title = metadata.get('title') or ''
                  version = metadata.get('version') or ''
                  creators = metadata.get('creators') or []
                  creator_names = [str(c.get('person_or_org', {}).get('name') or c.get('name') or '') for c in creators]
                  pids = data.get('pids') or {}
                  doi_obj = pids.get('doi') or {}
                  record_doi = doi_obj.get('identifier') or metadata.get('doi') or ''

                  checks['record_public'] = True
                  checks['doi_match'] = record_doi.lower() == expected_doi.lower()
                  checks['title_match'] = 'cogniprint' in title.lower()
                  checks['creator_match'] = any('adriashkin' in n.lower() for n in creator_names)
                  checks['version_match'] = (not version) or version.lstrip('v') == '0.1.2'

                  print(f'record_doi={record_doi}')
                  print(f'title={title}')
                  print(f'version={version}')
                  print('creators=' + '; '.join(creator_names))
              except Exception as exc:
                  print(f'parse_error={exc}')
          else:
              print('record_doi=')
              print('title=')
              print('version=')
              print('creators=')

          for key, value in checks.items():
              print(f'{key}={str(value).lower()}')
          print('verification=' + ('PASS' if all(checks.values()) else 'FAIL'))
          PY

          if [ -s "$TMP/doi-error.txt" ]; then
            echo "doi_error=$(tr '\n' ' ' < "$TMP/doi-error.txt" | head -c 500)" >> "$OUT"
          fi
          if [ -s "$TMP/zenodo-error.txt" ]; then
            echo "zenodo_error=$(tr '\n' ' ' < "$TMP/zenodo-error.txt" | head -c 500)" >> "$OUT"
          fi

          cat "$OUT"

      - name: Persist latest verification result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/zenodo-verification-latest.txt
          if git diff --cached --quiet; then
            echo 'No verification result change.'
          else
            git commit -m 'chore(audit): persist latest Zenodo verification result'
            git push
          fi

      - name: Enforce verification gate
        shell: bash
        run: |
          grep -q '^verification=PASS$' audit/zenodo-verification-latest.txt
