name: RAID Pilot Adapter CI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/raid-pilot-ci.yml"
      - "src/cogniprint/benchmarks/**"
      - "src/cogniprint/fingerprint.py"
      - "scripts/prepare_raid_pilot.py"
      - "tests/test_raid_pilot_adapter.py"
  pull_request:
    paths:
      - ".github/workflows/raid-pilot-ci.yml"
      - "src/cogniprint/benchmarks/**"
      - "src/cogniprint/fingerprint.py"
      - "scripts/prepare_raid_pilot.py"
      - "tests/test_raid_pilot_adapter.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-adapter-test:
    name: Offline adapter / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CogniPrint without external benchmark dependencies
        run: python -m pip install -e .

      - name: Compile RAID preparation CLI
        run: python -m py_compile scripts/prepare_raid_pilot.py

      - name: Run RAID adapter unit tests
        run: python -m unittest tests/test_raid_pilot_adapter.py -v
