name: Pages admin cutover evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  pull-requests: write
  issues: write

jobs:
  cutover:
    if: github.event.pull_request.title == 'OPS_TRIGGER_PAGES_ADMIN_CUTOVER_20260824'
    runs-on: ubuntu-latest
    steps:
      - name: Attempt Pages custom-domain cutover and comment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -u
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10")
          before_http=$(curl -sS -o /tmp/before.json -w '%{http_code}' "${headers[@]}" "$api" || true)
          put_http=$(curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT "${headers[@]}" "$api" -d '{"cname":"cogniprint.org"}' || true)
          after_http=$(curl -sS -o /tmp/after.json -w '%{http_code}' "${headers[@]}" "$api" || true)
          BEFORE_HTTP="$before_http" PUT_HTTP="$put_http" AFTER_HTTP="$after_http" python3 - <<'PY' > /tmp/evidence.md
          import json, os
          from pathlib import Path
          def load(path):
              try: return json.loads(Path(path).read_text())
              except Exception: return {}
          def slim(d):
              if not isinstance(d, dict): return {}
              return {k:d.get(k) for k in ('status','cname','html_url','source','build_type','https_enforced','message','documentation_url') if k in d}
          print('PAGES_ADMIN_CUTOVER_EVIDENCE_20260824')
          print('```json')
          print(json.dumps({
              'repository':'TakoVHS/CogniPrint-open',
              'requested_cname':'cogniprint.org',
              'before_http':os.environ.get('BEFORE_HTTP'),
              'put_http':os.environ.get('PUT_HTTP'),
              'after_http':os.environ.get('AFTER_HTTP'),
              'before':slim(load('/tmp/before.json')),
              'put_response':slim(load('/tmp/put.json')),
              'after':slim(load('/tmp/after.json')),
          }, indent=2, sort_keys=True))
          print('```')
          PY
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/evidence.md
