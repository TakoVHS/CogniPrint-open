name: cogniprint-self-hosted

services:
  cogniprint:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/cogniprint-workstation:development
    user: "10001:10001"
    read_only: true
    network_mode: "none"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - type: bind
        source: ./workspace
        target: /workspace
    command:
      - --help
